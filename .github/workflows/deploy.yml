name: Deploy paper site to GitHub Pages

# Publishes site/ (as the site root) to GitHub Pages.
# The paper + supplement PDFs and the ONNX model are pulled from the latest GitHub
# release (assets qlot-paper.pdf / qlot-supplement.pdf / qlot-final.onnx); figures,
# thumbnails, and data are built via scripts/site_build.py and the third-party JS
# via scripts/site_vendor.sh. No build artifacts or model weights are committed.
on:
  push:
    branches: [ master ]
    paths:
      - "site/**"
      - "scripts/**"
      - "data/**"
      - "docs/paper/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install poppler-utils (pdftoppm)
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils

      - name: Install Typst (pinned)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz -o /tmp/typst.tar.xz
          sudo tar -xJf /tmp/typst.tar.xz -C /usr/local/bin --strip-components=1 --wildcards '*/typst'
          typst --version

      - name: Download paper + supplement PDFs and model from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/paper models
          gh release download --repo "$GITHUB_REPOSITORY" --clobber \
            --pattern qlot-paper.pdf --pattern qlot-supplement.pdf \
            --pattern qlot-final.onnx --dir /tmp/release-assets
          mv /tmp/release-assets/qlot-paper.pdf docs/paper/paper.pdf
          mv /tmp/release-assets/qlot-supplement.pdf docs/paper/supplement.pdf
          mv /tmp/release-assets/qlot-final.onnx models/qlot-final.onnx
          ls -la docs/paper/paper.pdf docs/paper/supplement.pdf models/qlot-final.onnx

      - name: Vendor third-party JS (three.js + onnxruntime-web)
        run: bash scripts/site_vendor.sh

      - name: Build site assets
        run: python3 scripts/site_build.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
