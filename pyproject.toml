[project]
name = "qlot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "ffmpeg-python>=0.2.0",
    "fvcore>=0.1.5.post20221221",
    "imgui-bundle>=1.92.601",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.9",
    "kornia>=0.8.2",
    "matplotlib>=3.10.6",
    "mediapipe>=0.10.14",
    "numpy>=2.3.3",
    "onnx>=1.20.1",
    "onnxruntime-gpu>=1.23.2",
    "onnxscript>=0.6.1",
    "onnxsim>=0.6.5",
    "opencv-contrib-python>=4.11.0.86",
    "opencv-python>=4.13.0",
    "papermill>=2.7.0",
    "pytest>=9.1.1",
    "pyvista[all]>=0.47.1",
    "rich>=14.2.0",
    "scikit-image>=0.25.2",
    "setuptools<82.0.0", # Required by tensorboard
    "tensorboard>=2.20.0",
    "timm>=1.0.26",
    "torch==2.13.0+cu130",
    "torchinfo>=1.8.0",
    "torchvision>=0.24.0",
    "tqdm>=4.66",
    #"trame>=3.12.0",
    #"trame-server<3.8",
    #"trame-vtk>=2.10.0",
    #"trame-vuetify>=3.1.0",
    "trame-jupyter-extension>=2.1.4",
    "uv>=0.8.22",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch"}
torchvision = { index = "pytorch"}

[tool.black]
line-length = 130
